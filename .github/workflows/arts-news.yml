# 예술계 소식 자동 수집.
#
# 하루 한 번 scripts/arts-sources.json 에 적은 곳에서 소식을 받아
# Firestore 의 artsNews 에 「검토 대기」로 넣는다. 홈페이지에는 바로 나오지
# 않고, 사무국이 관리자 화면에서 눈 표시를 눌러 공개한 것만 나온다.
#
# 손으로 돌릴 때는 Actions 탭 → 이 워크플로 → Run workflow 를 누른다.
# 그때 dry_run 이 기본값 true 라서 받아 보기만 하고 저장하지 않는다.
# 실제로 담으려면 dry_run 을 false 로 바꿔서 돌린다.
name: 예술계 소식 수집

on:
  schedule:
    # 매일 00:00 UTC = 한국시간 오전 9시.
    # 참고: 저장소에 60일 동안 아무 변화가 없으면 GitHub 이 정기 실행을 멈춘다.
    # 그럴 때는 Actions 탭에서 다시 켜 주면 된다.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "받아 보기만 하기(저장하지 않음)"
        type: boolean
        default: true

# 저장소에 쓰지 않는다. 결과는 Firestore 로 간다.
permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 소식 수집
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          KBA_BOT_EMAIL: ${{ secrets.KBA_BOT_EMAIL }}
          KBA_BOT_PASSWORD: ${{ secrets.KBA_BOT_PASSWORD }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/collect-arts-news.js --dry-run
          else
            node scripts/collect-arts-news.js
          fi
