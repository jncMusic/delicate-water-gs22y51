<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2b303a" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />

    <title>한국관악협회 | KOREAN BAND ASSOCIATION</title>
    <meta
      name="description"
      content="한국관악협회(KBA)는 1973년 창설되어 한국음악의 발전과 전문 관악인 양성, 국제 음악문화 교류를 통한 관악인의 지위 향상과 권익 신장을 목적으로 활동합니다."
    />
    <meta name="author" content="한국관악협회" />

    <!--
      검색엔진 소유 확인용 태그. 각 콘솔에서 발급받아 붙인다.
      비밀값이 아니라 "이 사이트가 우리 계정 것"임을 알리는 표식이므로
      저장소에 그대로 둔다. 지우면 소유 확인이 풀린다.
    -->
    <meta name="naver-site-verification" content="2b487f2e8bd3dd61c36139470fce9e6c3f3a5b50" />
    <meta name="google-site-verification" content="XMIK-JEckYXjkC_FiESKKMwc6XJ_j9M_YhPjph70LEc" />

    <!--
      카카오톡·네이버·페이스북에 링크를 붙였을 때 보이는 정보.
      크롤러는 자바스크립트를 실행하기 전의 이 태그를 읽으므로 사이트 공통 값으로 둔다.
      절대 주소가 필요해서 빌드 뒤 scripts/postbuild.js 가 %SITE_URL% 을 채운다.
    -->
    <link rel="canonical" href="%SITE_URL%/" />
    <!-- 검색엔진이 새 글을 찾아오는 통로. 네이버는 이것을 콘텐츠 피드로 본다. -->
    <link
      rel="alternate"
      type="application/rss+xml"
      title="한국관악협회 소식"
      href="%SITE_URL%/rss.xml"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="한국관악협회" />
    <meta property="og:title" content="한국관악협회 | KOREAN BAND ASSOCIATION" />
    <meta
      property="og:description"
      content="1973년 창설. 전문 관악인 양성과 국제 음악문화 교류를 통해 관악인의 지위 향상과 권익 신장을 목적으로 활동합니다."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      검색엔진에게 "이 사이트는 한국관악협회라는 단체의 공식 홈페이지" 라고
      기계가 읽는 형식으로 알려 주는 부분이다. 사람에게는 보이지 않는다.
      구글은 이것으로 단체 정보 패널을 만들고, '한국관악협회' 처럼 이름으로
      찾을 때 공식 홈페이지를 가려내는 데 쓴다.
      주소는 절대 주소여야 해서 빌드 뒤 scripts/postbuild.js 가 %SITE_URL% 을 채운다.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "%SITE_URL%/#organization",
            "name": "한국관악협회",
            "alternateName": ["KBA", "KOREAN BAND ASSOCIATION", "한국 관악 협회"],
            "url": "%SITE_URL%/",
            "logo": "%SITE_URL%/og-image.png",
            "image": "%SITE_URL%/og-image.png",
            "foundingDate": "1973",
            "description": "한국관악협회는 관악 활동을 통해 음악 문화의 저변을 넓히고, 국내외 관악 음악 활동으로 국가 문화 발전에 기여하며, 청소년의 정서 함양과 차세대 관악 음악인 양성을 목적으로 하는 단체입니다.",
            "email": "kbaoffice@naver.com",
            "telephone": "+82-2-2655-0520",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "사당로 287, 5층",
              "addressLocality": "동작구",
              "addressRegion": "서울특별시",
              "addressCountry": "KR"
            },
            "sameAs": ["https://blog.naver.com/kbaoffice"]
          },
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "url": "%SITE_URL%/",
            "name": "한국관악협회",
            "inLanguage": "ko-KR",
            "publisher": { "@id": "%SITE_URL%/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body class="bg-white text-brand-950">
    <!--
      전에는 여기에 "자바스크립트를 켜 주세요" 안내가 있었다. 지금은 빌드할 때
      화면마다 HTML 을 미리 그려 두므로(scripts/prerender.js) 자바스크립트가
      없어도 글을 읽고 메뉴를 눌러 옮겨 다닐 수 있다. 맞지 않는 안내가 모든
      쪽의 첫 문장으로 나오면 검색 결과에도 그 문장이 잡히므로 뺀다.
    -->
    <div id="root"></div>
  </body>
</html>
